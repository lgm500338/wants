<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>원하는것</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1C1B27;
    --bg-vignette: #14131C;
    --paper: #F6F1E6;
    --paper-line: #E4DAC0;
    --ink: #2B2620;
    --ink-soft: #8A8172;
    --ink-faint: #B8AF9C;
    --gold: #C69A4B;
    --gold-soft: #DDBE84;
    --sage: #67806D;
    --sage-soft: #DDE6DD;
    --wine: #8A4A4E;
    --shadow: rgba(15, 14, 20, 0.35);
    --font-display: 'Noto Serif KR', 'Nanum Myeongjo', Georgia, 'Times New Roman', serif;
    --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', Pretendard, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161F;
      --bg-vignette: #100F16;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #17161F;
    --bg-vignette: #100F16;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-vignette) 0%, var(--bg) 60%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px) 16px 64px;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars span {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--gold-soft);
    border-radius: 50%;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--op-min, 0.15); transform: scale(1); }
    50%      { opacity: var(--op-max, 0.9);  transform: scale(1.4); }
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 96px);
  }

  header.top {
    text-align: center;
    margin-bottom: 22px;
    padding: 4px 8px 0;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }

  h1.title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 8vw, 34px);
    color: var(--paper);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 14px;
    color: var(--gold-soft);
    margin: 0;
    line-height: 1.6;
  }

  /* --- Notebook card --- */
  .book {
    background: var(--paper);
    border-radius: 18px;
    box-shadow: 0 24px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow: hidden;
    position: relative;
  }

  .book::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 34px;
    background: linear-gradient(90deg, rgba(0,0,0,0.05), transparent);
    pointer-events: none;
  }

  /* --- Tabs (book dividers) --- */
  .tabs {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    border-bottom: 1px solid var(--paper-line);
    background: linear-gradient(180deg, rgba(0,0,0,0.03), transparent);
    padding: 0 6px;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    appearance: none;
    border: none;
    background: transparent;
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--ink-soft);
    padding: 16px 14px 13px;
    cursor: pointer;
    position: relative;
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .tab[aria-selected="true"] {
    color: var(--ink);
    font-weight: 600;
  }

  .tab[aria-selected="true"]::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; bottom: 0;
    height: 2px;
    background: var(--gold);
    border-radius: 2px 2px 0 0;
  }

  .tab .count {
    font-family: var(--font-body);
    font-size: 10.5px;
    color: var(--ink-faint);
    margin-left: 3px;
  }

  /* --- Panel --- */
  .panel {
    padding: 22px 22px 26px;
  }

  .panel-head {
    margin-bottom: 16px;
  }

  .panel-head .scope-line {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0;
  }

  form.add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    background: #FFFDF8;
    border: 1px solid var(--paper-line);
    border-radius: 11px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .add-row input[type="text"]:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(198, 154, 75, 0.15);
  }

  .add-row input[type="text"]::placeholder {
    color: var(--ink-faint);
  }

  .add-row button {
    appearance: none;
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14.5px;
    padding: 0 18px;
    border-radius: 11px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .add-row button:hover { background: #14110C; }
  .add-row button:active { transform: scale(0.96); }

  /* --- List --- */
  ul.entries {
    list-style: none;
    margin: 0;
    padding: 0 4px 0 0;
    max-height: min(52vh, 460px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  ul.entries::-webkit-scrollbar { width: 6px; }
  ul.entries::-webkit-scrollbar-thumb {
    background: var(--paper-line);
    border-radius: 3px;
  }
  ul.entries::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

  .entry {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 2px;
    border-bottom: 1px dashed var(--paper-line);
    animation: rise 0.35s ease both;
  }
  .entry:last-child { border-bottom: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .check {
    appearance: none;
    flex: 0 0 auto;
    width: 21px;
    height: 21px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.6px solid var(--ink-faint);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, background 0.2s ease;
    position: relative;
  }

  .check.done {
    border-color: var(--sage);
    background: var(--sage-soft);
  }
  .check.done::after {
    content: "";
    width: 9px;
    height: 5px;
    border-left: 2px solid var(--sage);
    border-bottom: 2px solid var(--sage);
    transform: rotate(-45deg) translate(0.5px, -1px);
  }

  .entry-body {
    flex: 1;
    min-width: 0;
  }

  .entry-text {
    font-family: var(--font-body);
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    word-break: break-word;
    transition: color 0.2s ease;
  }

  .entry.done .entry-text {
    color: var(--ink-faint);
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1px;
  }

  .echo-note {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 12.5px;
    color: var(--gold);
  }

  .echo-note svg { flex: 0 0 auto; opacity: 0.85; }

  .del {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    flex: 0 0 auto;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .del:hover { color: var(--wine); background: rgba(138,74,78,0.08); }

  /* --- Empty state --- */
  .empty {
    padding: 30px 6px 10px;
    text-align: center;
  }
  .empty p {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 14.5px;
    color: var(--ink-faint);
    line-height: 1.7;
    margin: 0;
  }

  .storage-note {
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    opacity: 0.6;
    margin: 8px 0 0;
    letter-spacing: 0.01em;
  }

  footer.note {
    text-align: center;
    margin-top: auto;
    padding-top: 20px;
    font-size: 11.5px;
    color: var(--ink-faint);
    line-height: 1.6;
    padding-left: 20px;
    padding-right: 20px;
  }

  .pop-sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    color: var(--gold);
    white-space: nowrap;
    animation: pop-rise 0.9s ease forwards;
  }
  @keyframes pop-rise {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.9); }
    18%  { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -26px) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; }
    .pop-sparkle { animation: none; opacity: 0; }
    .stars span { animation: none; opacity: 0.4; }
    * { transition: none !important; }
  }
  /* --- 다이어리 --- */
  header.top { position: relative; }

  .diary-btn {
    position: absolute;
    top: 0;
    right: 0;
    appearance: none;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    border: 1px solid rgba(221, 190, 132, 0.35);
    background: rgba(255, 255, 255, 0.04);
    color: var(--gold-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .diary-btn:hover,
  .diary-btn[aria-pressed="true"] {
    background: rgba(221, 190, 132, 0.16);
    border-color: var(--gold-soft);
  }

  .lang-btn {
    position: absolute;
    top: 0;
    left: 0;
    appearance: none;
    min-width: 44px;
    height: 44px;
    padding: 0 10px;
    border-radius: 13px;
    border: 1px solid rgba(221, 190, 132, 0.35);
    background: rgba(255, 255, 255, 0.04);
    color: var(--gold-soft);
    font-family: var(--font-body);
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .lang-btn:hover {
    background: rgba(221, 190, 132, 0.16);
    border-color: var(--gold-soft);
  }

  .scope-date {
    font-family: var(--font-body);
    font-style: normal;
    font-size: 12px;
    color: var(--ink-faint);
    margin-left: 8px;
  }

  .entry-meta {
    margin-top: 2px;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .check.static { cursor: default; }

  .diary-view { padding: 18px 18px 22px; }

  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .cal-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .cal-nav {
    appearance: none;
    border: none;
    background: transparent;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 22px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cal-nav:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }

  .cal-week,
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cal-week span {
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    padding: 4px 0 6px;
  }
  .cal-grid { gap: 2px; }

  .cal-day {
    appearance: none;
    border: none;
    background: transparent;
    border-radius: 10px;
    min-height: 44px;
    padding: 6px 0 5px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: var(--font-body);
    color: var(--ink);
    transition: background 0.15s ease;
  }
  .cal-day:hover { background: rgba(0, 0, 0, 0.04); }
  .cal-num { font-size: 13.5px; line-height: 1.2; }
  .cal-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: transparent;
  }
  .cal-dot.faint { background: var(--ink-faint); opacity: 0.75; }
  .cal-dot.gold  { background: var(--gold); }
  .cal-day.today { box-shadow: inset 0 0 0 1px var(--gold-soft); }
  .cal-day.sel { background: var(--ink); color: var(--paper); }
  .cal-day.sel:hover { background: var(--ink); }

  .day-head {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
  }
  .day-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 2px;
  }
  .day-sum {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 6px;
    min-height: 1em;
  }
  .diary-view ul.entries { max-height: min(34vh, 300px); }

  /* --- 백업 --- */
  .backup {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
  }
  .backup-title {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .backup-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .backup-btn {
    appearance: none;
    border: 1px solid var(--paper-line);
    background: #FFFDF8;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 9px 14px;
    min-height: 40px;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s ease;
  }
  .backup-btn:hover { border-color: var(--gold); }
  .backup-msg {
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 8px 0 0;
    min-height: 1.2em;
  }

  /* --- 계정 --- */
  .account {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
  }
  .account-note {
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    font-family: var(--font-body);
    font-size: 14.5px;
    color: var(--ink);
    background: #FFFDF8;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 11px 13px;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .google-btn:hover { border-color: var(--gold); }
  .google-btn:focus-visible {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(198, 154, 75, 0.15);
  }
  .google-btn:disabled { opacity: 0.5; cursor: default; }
  .backup-btn.primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .backup-btn:disabled { opacity: 0.5; cursor: default; }
  .account-who {
    font-size: 13px;
    color: var(--ink);
    margin: 0 0 2px;
    word-break: break-all;
  }
  .account-sync {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 10px;
    min-height: 1.2em;
  }
  .logout-ask {
    margin-top: 10px;
    padding: 10px 12px;
    border: 1px dashed var(--paper-line);
    border-radius: 10px;
  }
  .logout-ask p {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 8px;
  }

  /* --- 오늘의 명언 --- */
  figure.quote {
    margin: -6px auto 18px;
    padding: 14px 10px 0;
    max-width: 400px;
    text-align: center;
    position: relative;
  }
  figure.quote::before {
    content: "";
    display: block;
    width: 22px;
    height: 1px;
    margin: 0 auto 12px;
    background: var(--gold-soft);
    opacity: 0.5;
  }
  figure.quote blockquote {
    margin: 0;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 14px;
    line-height: 1.75;
    color: rgba(246, 241, 230, 0.86);
    word-break: keep-all;
    text-wrap: balance;
  }
  figure.quote figcaption {
    margin-top: 6px;
    font-family: var(--font-body);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
  }

  /* --- 비어 있을 때 살짝 알려주는 한 줄 --- */
  .nudge {
    display: block;
    appearance: none;
    margin: 0 auto 16px;
    padding: 9px 16px;
    min-height: 40px;
    border: 1px solid rgba(221, 190, 132, 0.28);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.03);
    color: var(--gold-soft);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13.5px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .nudge[hidden] { display: none; }
  .nudge:hover {
    background: rgba(221, 190, 132, 0.12);
    border-color: var(--gold-soft);
  }
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <button class="lang-btn" id="langBtn" type="button"></button>
    <button class="diary-btn" id="diaryBtn" type="button" aria-label="다이어리 열기" aria-pressed="false" title="다이어리" data-i18n-title="diaryTitle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v16H6.5A1.5 1.5 0 0 0 5 20.5v-16Z"/><path d="M5 20.5A1.5 1.5 0 0 0 6.5 22H19v-3"/><path d="M9.5 8h6"/></svg>
    </button>
    <p class="eyebrow" id="todayLabel"></p>
    <h1 class="title" data-i18n="title">원하는것</h1>
    <p class="subtitle" data-i18n="subtitle">이루는 것 말고, 지금 원하는 것</p>
  </header>

  <figure class="quote" id="quote">
    <blockquote id="quoteText"></blockquote>
    <figcaption id="quoteBy"></figcaption>
  </figure>

  <button class="nudge" id="nudge" type="button" hidden></button>

  <div class="book">
    <div id="mainView">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel">
      <div class="panel-head">
        <p class="scope-line" id="scopeLine"></p>
      </div>
      <form class="add-row" id="addForm" autocomplete="off">
        <input type="text" id="entryInput" maxlength="80" placeholder="" />
        <button type="submit" data-i18n="add">적기</button>
      </form>
      <ul class="entries" id="entries"></ul>
      <div class="empty" id="emptyState" hidden>
        <p id="emptyText"></p>
      </div>
    </div>
    </div>

    <div id="diaryView" class="diary-view" hidden>
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" type="button" data-i18n-aria="prevMonth" aria-label="이전 달">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="calNext" type="button" data-i18n-aria="nextMonth" aria-label="다음 달">›</button>

  // ---- 날짜 도우미 ----

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function longDate(d) {
    if (LANG === "ko") return (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + WEEKDAYS[d.getDay()] + "요일";
    return EN_WEEKDAYS[d.getDay()] + ", " + EN_MONTHS[d.getMonth()] + " " + d.getDate();
  }
  function longDateYear(d) {
    return LANG === "ko" ? d.getFullYear() + "년 " + longDate(d) : longDate(d) + ", " + d.getFullYear();
  }
  function shortDate(m, d) { return LANG === "ko" ? (m + 1) + "월 " + d + "일" : EN_MONTHS[m] + " " + d; }

  function dateForCat(cat) {
    return cat.store === "day" ? ymd(addDays(new Date(), cat.offset || 0)) : ymd(new Date());
  }

  // ---- 저장 ----

  function emptyState() {
    var s = {};
    STORES.forEach(function (k) { s[k] = []; });
    return s;
  }

  function normalize(parsed) {
    var s = emptyState();
    STORES.forEach(function (k) {
      if (Array.isArray(parsed[k])) {
        parsed[k].forEach(function (e) {
          if (!e.date) e.date = ymd(new Date(e.createdAt || Date.now()));
          s[k].push(e);
        });
      }
    });
    return s;
  }

  // 예전 버전(탭마다 목록 하나)을 날짜가 붙는 구조로 옮겨요.
  // 오늘 탭 항목은 적은 날짜, 내일 탭 항목은 적은 날짜의 다음 날로 분류해요.
  function migrate(v1) {
    var s = emptyState();
    ["daily", "tomorrow"].forEach(function (k) {
      (Array.isArray(v1[k]) ? v1[k] : []).forEach(function (e) {
        var created = new Date(e.createdAt || Date.now());
        e.date = ymd(addDays(created, k === "tomorrow" ? 1 : 0));
        s.day.push(e);
      });
    });
    ["weekly", "monthly", "yearly", "decade", "lifetime"].forEach(function (k) {
      (Array.isArray(v1[k]) ? v1[k] : []).forEach(function (e) {
        e.date = ymd(new Date(e.createdAt || Date.now()));
        s[k].push(e);
      });
    });
    return s;
  }

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* 저장소를 못 쓰는 환경 */ }
    if (raw) {
      try { return normalize(JSON.parse(raw)); } catch (e) { /* 아래에서 이어서 시도 */ }
    }
    var old = null;
    try { old = localStorage.getItem(OLD_KEY); } catch (e) { /* 무시 */ }
    if (old) {
      try { return migrate(JSON.parse(old)); } catch (e) { /* 무시 */ }
    }
    return emptyState();
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* 저장소를 못 써도 이번 접속 동안은 계속 쓸 수 있어요 */
    }
  }

  STORES.forEach(function (k) {

  function labelOfStore(store) {

  function tokenizeEn(text) {
    var words = text.toLowerCase().replace(/[^a-z0-9\s'-]/g, " ").replace(/['-]/g, "").split(/\s+/).filter(Boolean);
    var tokens = [];
    words.forEach(function (w) {
      var x = w;
      if (x.length > 5 && x.slice(-3) === "ing") x = x.slice(0, -3);
      else if (x.length > 4 && x.slice(-2) === "ed") x = x.slice(0, -2);
      else if (x.length > 4 && x.slice(-2) === "es") x = x.slice(0, -2);
      else if (x.length > 3 && x.slice(-1) === "s") x = x.slice(0, -1);
      if (x.length >= 3 && EN_STOPWORDS.indexOf(w) < 0 && EN_STOPWORDS.indexOf(x) < 0) tokens.push(x);
    });
    return tokens;
  }

  function tokenize(text) {
    if (!/[\u3131-\u318E\uAC00-\uD7A3]/.test(text)) return tokenizeEn(text);
    var norm = text.replace(/[.,!?~^…·"'“”‘’]/g, " ");
    var raw = norm.split(/\s+/).filter(Boolean);
    var tokens = [];
    raw.forEach(function (w) {
      var t = w;
      STOPWORDS.forEach(function (sw) {
        if (t.length > sw.length && t.slice(-sw.length) === sw) {
          t = t.slice(0, t.length - sw.length);
        }
      });
      if (t.length >= 2) tokens.push(t);
    });
    return tokens;
  }

  function allEntries() {
    var out = [];
    STORES.forEach(function (k) {
      state[k].forEach(function (e) { out.push(e); });
    });
    return out;
  }

  // 이전에 적은 항목(전체 기록) 중 의미 있는 단어가 겹치는 개수
  function echoCount(newTokens, excludeId) {
    if (newTokens.length === 0) return 0;
    var tokenSet = {};
    newTokens.forEach(function (t) { tokenSet[t] = true; });
    var matches = 0;
    allEntries().forEach(function (e) {
      if (e.id === excludeId) return;
      var overlap = (e.tokens || []).some(function (t) { return tokenSet[t]; });
      if (overlap) matches++;
    });
    return matches;
  }

  // ---- 화면 ----

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(function (c) {
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", c.key === activeKey ? "true" : "false");
      var count = listFor(c).filter(function (e) { return !e.done; }).length;
      btn.innerHTML = ct(c, "label") + (count > 0 ? '<span class="count">' + count + '</span>' : "");
      btn.addEventListener("click", function () {
        activeKey = c.key;
        renderTabs();
        renderPanel();
        renderNudge();
        inputEl.focus({ preventScroll: true });
      });
      tabsEl.appendChild(btn);
    });
  }

  function svgEcho() {
    return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  }

  function renderPanel() {
    var cat = currentCat();
    scopeLineEl.textContent = ct(cat, "scope");
    if (cat.store === "day") {
      var chip = document.createElement("span");
      chip.className = "scope-date";
      chip.textContent = longDate(addDays(new Date(), cat.offset || 0));
      scopeLineEl.appendChild(chip);
    }
    inputEl.placeholder = ct(cat, "placeholder");

    var list = listFor(cat);
    entriesEl.innerHTML = "";

    if (list.length === 0) {
      emptyEl.hidden = false;
      emptyTextEl.textContent = ct(cat, "empty");
    } else {
      emptyEl.hidden = true;
      list.slice().reverse().forEach(function (entry) {
        entriesEl.appendChild(renderEntry(entry, cat.store, false, ""));
      });
    }
  }

  // readOnly: 다이어리에서 지난 기록을 볼 때. 이룬 항목은 × 없이 그대로 남아요.
  function renderEntry(entry, storeKey, readOnly, metaLabel) {
    var li = document.createElement("li");
    li.className = "entry" + (entry.done ? " done" : "");

    var check;
    if (readOnly) {
      check = document.createElement("div");
      check.className = "check static" + (entry.done ? " done" : "");
      check.setAttribute("role", "img");
      check.setAttribute("aria-label", entry.done ? t("checkDone") : t("checkNot"));
    } else {
      check = document.createElement("button");
      check.className = "check" + (entry.done ? " done" : "");
      check.type = "button";
      check.setAttribute("aria-label", entry.done ? t("unmarkDone") : t("markDone"));
      check.addEventListener("click", function () {
        var turningDone = !entry.done;
        if (turningDone) {
          var rect = check.getBoundingClientRect();
          spawnSparkle(rect.left + rect.width / 2, rect.top);
        }
        entry.done = turningDone;
        entry.updatedAt = Date.now();
        saveState();
        pushOne(entry, storeKey);
        renderAll();
      });
    }

    var body = document.createElement("div");
    body.className = "entry-body";

    var text = document.createElement("div");
    text.className = "entry-text";
    text.textContent = entry.text;
    body.appendChild(text);

    if (readOnly && metaLabel) {
      var meta = document.createElement("div");
      meta.className = "entry-meta";
      meta.textContent = metaLabel;
      body.appendChild(meta);
    }

    if (!readOnly) {
      var echo = echoCount(entry.tokens || [], entry.id);
      if (echo >= 1) {
        var note = document.createElement("div");
        note.className = "echo-note";
        note.innerHTML = svgEcho() + "<span></span>";
        note.lastChild.textContent = t("echo", { n: ordinal(echo + 1) });
        body.appendChild(note);
      }
    }

    li.appendChild(check);
    li.appendChild(body);

    // 이룬 항목에는 ×가 없어요. 지우고 싶다면 먼저 체크를 풀어야 해요.
    if (!readOnly && !entry.done) {
      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.setAttribute("aria-label", t("del"));
      del.textContent = "×";
      del.addEventListener("click", function () {
        queueDelete(entry);
        state[storeKey] = state[storeKey].filter(function (e) { return e.id !== entry.id; });
        saveState();
        renderAll();
      });
      li.appendChild(del);
    }
    return li;
  }

  // ---- 다이어리 ----

  function entriesByDate() {
    var map = {};
    STORES.forEach(function (store) {
      var label = labelOfStore(store);
      state[store].forEach(function (e) {
        (map[e.date] = map[e.date] || []).push({ entry: e, label: label, store: store });
      });
    });
    return map;
  }

  function renderDiary() {
    var map = entriesByDate();
    var todayS = ymd(new Date());

    calTitleEl.textContent = LANG === "ko" ? viewY + "년 " + (viewM + 1) + "월" : EN_MONTHS[viewM] + " " + viewY;
    calGridEl.innerHTML = "";

    var first = new Date(viewY, viewM, 1);
    var daysInMonth = new Date(viewY, viewM + 1, 0).getDate();

    for (var i = 0; i < first.getDay(); i++) {
      var blank = document.createElement("div");
      blank.className = "cal-blank";
      calGridEl.appendChild(blank);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var ds = viewY + "-" + pad(viewM + 1) + "-" + pad(d);
      var items = map[ds] || [];
      var doneCount = items.filter(function (x) { return x.entry.done; }).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day" + (ds === todayS ? " today" : "") + (ds === selDate ? " sel" : "");
      var summary = items.length
        ? t("calAriaMore", { date: shortDate(viewM, d), n: items.length, m: doneCount })
        : t("calAria", { date: shortDate(viewM, d) });
      btn.setAttribute("aria-label", summary);
      btn.setAttribute("aria-pressed", ds === selDate ? "true" : "false");
      var dotClass = items.length ? (doneCount > 0 ? " gold" : " faint") : "";
      btn.innerHTML = '<span class="cal-num">' + d + '</span><span class="cal-dot' + dotClass + '"></span>';
      btn.addEventListener("click", (function (s) {
        return function () { selDate = s; renderDiary(); };
      })(ds));
      calGridEl.appendChild(btn);
    }

    var picked = (map[selDate] || []).slice().sort(function (a, b) {
      return (a.entry.createdAt || 0) - (b.entry.createdAt || 0);
    });
    var pickedDone = picked.filter(function (x) { return x.entry.done; }).length;

    dayTitleEl.textContent = longDate(parseYmd(selDate));
    daySumEl.textContent = picked.length ? t("daySum", { n: picked.length, m: pickedDone }) : "";

    diaryListEl.innerHTML = "";
    if (picked.length === 0) {
      diaryEmptyEl.hidden = false;
    } else {
      diaryEmptyEl.hidden = true;
      picked.forEach(function (x) {
        diaryListEl.appendChild(renderEntry(x.entry, x.store, true, x.label));
      });
    }
  }

  function setDiary(open) {
    inDiary = open;
    mainViewEl.hidden = open;
    diaryViewEl.hidden = !open;
    diaryBtn.setAttribute("aria-pressed", open ? "true" : "false");
    diaryBtn.setAttribute("aria-label", open ? t("diaryClose") : t("diaryOpen"));
    renderNudge();
    if (open) {
      var sel = parseYmd(selDate);
      viewY = sel.getFullYear();
      viewM = sel.getMonth();
      renderDiary();
    } else {
      renderAll();
    }
  }

  diaryBtn.addEventListener("click", function () { setDiary(!inDiary); });

  document.getElementById("calPrev").addEventListener("click", function () {
    viewM--;
    if (viewM < 0) { viewM = 11; viewY--; }
    renderDiary();
  });
  document.getElementById("calNext").addEventListener("click", function () {

    if (viewM > 11) { viewM = 0; viewY++; }
    renderDiary();
  });

  // ---- 백업: 파일로 저장 / 불러오기 ----

  function showBackupMsg(msg) { backupMsgEl.textContent = msg; }

  // 미리보기 화면에서는 일반 다운로드가 막혀 있어서, 가능하면 플랫폼의 저장 기능(downloads)을 먼저 써요.
  // 그 기능이 없는 곳(내 사이트에 올린 앱 등)에서는 브라우저의 일반 다운로드로 저장해요.
  function plainDownload(filename, text) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportBackup() {
    var payload = { app: "wants", version: 2, exportedAt: new Date().toISOString(), state: state };
    var text = JSON.stringify(payload, null, 2);
    var filename = "wants-backup-" + ymd(new Date()) + ".json";
    var doneMsg = t("backupDone", { n: allEntries().length });

    var viaPlatform = null;
    try {
      if (window.claude && typeof window.claude.use === "function") viaPlatform = window.claude.use("downloads");
    } catch (e) { viaPlatform = null; }

    if (!viaPlatform || typeof viaPlatform.then !== "function") {
      plainDownload(filename, text);
      showBackupMsg(doneMsg);
      return;
    }

    viaPlatform.then(function (dl) {
      if (!dl) { plainDownload(filename, text); showBackupMsg(doneMsg); return; }
      return dl.save({ filename: filename, data: text }).then(function () {
        showBackupMsg(doneMsg);
      }, function (err) {
        var code = err && err.code;
        if (code === "declined") showBackupMsg(t("saveCancelled"));
        else if (code === "rate_limited") showBackupMsg(t("tryLater"));
        else showBackupMsg(t("noSave"));
      });
    }, function () {
      plainDownload(filename, text);
      showBackupMsg(doneMsg);
    });
  }

  // 파일에서 읽은 항목은 믿지 않고, 필요한 칸만 골라 새로 만들어요.
  function cleanEntry(e) {
    if (!e || typeof e.text !== "string") return null;
    var text = e.text.trim().slice(0, 200);
    if (!text) return null;
    var created = typeof e.createdAt === "number" ? e.createdAt : Date.now();
    var date = (typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date)) ? e.date : ymd(new Date(created));
    var id = (typeof e.id === "string" && e.id) ? e.id.slice(0, 40) : created.toString(36) + Math.random().toString(36).slice(2, 7);
    return { id: id, text: text, done: e.done === true, createdAt: created, updatedAt: created, date: date, tokens: tokenize(text) };
  }

  // 지금 있는 기록은 그대로 두고, 없는 것만 더해요. 파일에서 이뤘다고 표시된 항목은 이룸으로 반영해요.
  function importBackup(text) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
    var src = parsed && typeof parsed === "object" ? (parsed.state && typeof parsed.state === "object" ? parsed.state : parsed) : null;
    var incoming = null;
    if (src && Array.isArray(src.day)) incoming = src;
    else if (src && (Array.isArray(src.daily) || Array.isArray(src.tomorrow))) incoming = migrate(src);
    if (!incoming) {
      showBackupMsg(t("badFile"));
      return;
    }

    var byId = {};
    allEntries().forEach(function (e) { byId[e.id] = e; });
    var added = 0, skipped = 0, marked = 0;

    STORES.forEach(function (k) {
      (Array.isArray(incoming[k]) ? incoming[k] : []).forEach(function (raw) {
        var e = cleanEntry(raw);
        if (!e) return;
        var existing = byId[e.id];
        if (existing) {
          skipped++;
          if (e.done && !existing.done) { existing.done = true; existing.updatedAt = Date.now(); marked++; }
          return;
        }
        byId[e.id] = e;
        state[k].push(e);
        added++;
      });
    });

    if (added || marked) { saveState(); renderAll(); syncSoon(); }
    if (!added && !marked) {
      showBackupMsg(t("nothingNew"));
    } else {
      showBackupMsg(t("imported", { a: added, s: skipped }) + (marked ? t("importedMarked", { m: marked }) : ""));
    }
  }

  exportBtn.addEventListener("click", exportBackup);
  importBtn.addEventListener("click", function () { importFileEl.click(); });
  importFileEl.addEventListener("change", function () {
    var file = importFileEl.files && importFileEl.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showBackupMsg(t("tooBig"));
      importFileEl.value = "";
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      importBackup(String(reader.result || ""));
      importFileEl.value = "";
    };
    reader.onerror = function () {
      showBackupMsg(t("readFail"));
      importFileEl.value = "";
    };
    reader.readAsText(file);
  });

  // ---- 로그인 / 기기 간 동기화 (선택 기능, 기록은 늘 이 기기에 먼저 저장) ----
  var SB_LIB_URL = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
  var META_KEY = "wantsapp_sync";
  var sb = null;
  var user = null;
  var syncing = false;
  var syncAgain = false;
  var syncTimer = null;
  var currentSync = Promise.resolve(true);
  var syncMeta = loadMeta();

  function byId(id) { return document.getElementById(id); }

  function loadMeta() {
    try {
      var m = JSON.parse(localStorage.getItem(META_KEY) || "null");
      if (m && typeof m.uid === "string" && Array.isArray(m.synced)) return m;
    } catch (e) {}
    return { uid: "", synced: [] };
  }
  function saveMeta() {
    try { localStorage.setItem(META_KEY, JSON.stringify(syncMeta)); } catch (e) {}
  }
  function syncedSet() {
    var s = {};
    syncMeta.synced.forEach(function (id) { s[id] = true; });
    return s;
  }

  function accountMsg(text) { byId("accountMsg").textContent = text || ""; }
  function syncLine(text) { byId("accountSync").textContent = text || ""; }

  function friendlyError(err) {
    var m = String((err && err.message) || err || "").toLowerCase();
    if (m.indexOf("rate limit") >= 0 || m.indexOf("too many") >= 0) return t("errRate");
    if (m.indexOf("fetch") >= 0 || m.indexOf("network") >= 0 || m.indexOf("failed") >= 0) return t("errNet");
    var raw = String((err && err.message) || err || "").slice(0, 120);
    return t("errGeneric") + (raw ? " (" + raw + ")" : "");
  }

  function toRow(entry, store) {
    return {
      id: entry.id,
      store: store,
      text: String(entry.text).slice(0, 200),
      done: entry.done === true,
      created_at: entry.createdAt,
      entry_date: entry.date,
      updated_at: new Date(entry.updatedAt || entry.createdAt || Date.now()).toISOString()
    };
  }

  function markSynced(id) {
    if (syncMeta.synced.indexOf(id) < 0) { syncMeta.synced.push(id); saveMeta(); }
  }

  // 한 항목을 바로 올려요. 실패해도 괜찮아요. 다음 동기화 때 다시 맞춰져요.
  function pushOne(entry, store) {
    if (!sb || !user) return;
    try {
      sb.from("entries").upsert(toRow(entry, store)).then(function (res) {
        if (res && !res.error) { markSynced(entry.id); syncLine(t("synced")); }
        else syncLine(t("syncLater"));
      }, function () { syncLine(t("syncLater")); });
    } catch (e) {}
  }

  function queueDelete(entry) {
    if (!sb || !user) return;
    try {
      sb.from("entries").delete().eq("id", entry.id).then(function (res) {
        if (res && !res.error) {
          syncMeta.synced = syncMeta.synced.filter(function (id) { return id !== entry.id; });
          saveMeta();
        }
      }, function () {});
    } catch (e) {}
  }

  function syncSoon() {
    if (!sb || !user) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { runSync(); }, 800);
  }

  function fetchAllRemote() {
    var all = [];
    function page(from) {
      return sb.from("entries")
        .select("id,store,text,done,created_at,entry_date,updated_at")
        .order("id", { ascending: true })
        .range(from, from + 999)
        .then(function (res) {
          if (res.error) throw res.error;
          var rows = res.data || [];
          all = all.concat(rows);
          if (rows.length === 1000) return page(from + 1000);
          return all;
        });
    }
    return page(0);
  }

  function chunk(list, n) {
    var out = [];
    for (var i = 0; i < list.length; i += n) out.push(list.slice(i, i + n));
    return out;
  }

  function runSync() {
    if (!sb || !user) return Promise.resolve(false);
    if (syncing) { return currentSync.then(function () { return runSync(); }); }
    syncing = true;
    syncLine(t("syncing"));
    var uidAtStart = user.id;
    currentSync = fetchAllRemote().then(function (remote) {
      if (!user || user.id !== uidAtStart) return false;
      var rmap = {};
      remote.forEach(function (r) { rmap[r.id] = r; });
      var known = syncedSet();
      var toUpload = [];
      var toDeleteRemote = [];
      var changedLocal = false;
      var localIds = {};

      STORES.forEach(function (store) {
        var keep = [];
        state[store].forEach(function (L) {
          localIds[L.id] = true;
          var R = rmap[L.id];
          if (!R) {
            if (known[L.id]) { changedLocal = true; return; } // 다른 기기에서 지웠어요
            toUpload.push(toRow(L, store));
            keep.push(L);
            return;
          }
          var rMs = new Date(R.updated_at).getTime() || 0;
          var lMs = L.updatedAt || 0;
          if (lMs > rMs) toUpload.push(toRow(L, store));
          else if (rMs > lMs) {
            L.text = R.text;
            L.done = R.done === true;
            L.updatedAt = rMs;
            L.tokens = tokenize(R.text);
            changedLocal = true;
          }
          keep.push(L);
        });
        state[store] = keep;
      });

      remote.forEach(function (R) {
        if (localIds[R.id]) return;
        if (known[R.id]) { toDeleteRemote.push(R.id); return; } // 이 기기에서 지웠어요
        if (STORES.indexOf(R.store) < 0) return;
        var created = Number(R.created_at) || Date.now();
        state[R.store].push({
          id: R.id,
          text: R.text,
          done: R.done === true,
          createdAt: created,
          updatedAt: new Date(R.updated_at).getTime() || created,
          date: R.entry_date,
          tokens: tokenize(R.text)
        });
        changedLocal = true;
      });

      var jobs = [];
      chunk(toUpload, 200).forEach(function (part) {
        jobs.push(sb.from("entries").upsert(part).then(function (res) { if (res.error) throw res.error; }));
      });
      chunk(toDeleteRemote, 100).forEach(function (part) {
        jobs.push(sb.from("entries").delete().in("id", part).then(function (res) { if (res.error) throw res.error; }));
      });

      return Promise.all(jobs).then(function () {
        var ids = [];
        STORES.forEach(function (s) { state[s].forEach(function (e) { ids.push(e.id); }); });
        syncMeta.uid = uidAtStart;
        syncMeta.synced = ids;
        saveMeta();
        if (changedLocal) { saveState(); renderAll(); }
        syncLine(t("synced"));
        return true;
      });
    }).then(function (okSync) {
      syncing = false;
      if (syncAgain) { syncAgain = false; syncSoon(); }
      return okSync;
    }, function () {
      syncing = false;
      syncLine(t("syncFail"));
      return false;
    });
    return currentSync;
  }

  function renderAccount() {
    var box = byId("accountBox");
    var note = byId("storageNote");
    if (!sb) { box.hidden = true; return; }
    box.hidden = false;
    byId("accountOut").hidden = !!user;
    byId("accountIn").hidden = !user;
    if (user) {
      byId("accountWho").textContent = user.email || t("loggedIn");
      note.textContent = t("storageAccount");
    } else {
      note.textContent = t("storageLocal");
      byId("logoutAsk").hidden = true;
      byId("googleBtn").disabled = false;
    }
  }

  function wipeLocal() {
    STORES.forEach(function (s) { state[s] = []; });
    saveState();
    syncMeta = { uid: "", synced: [] };
    saveMeta();
    renderAll();
  }

  function applySession(session) {
    var next = session && session.user ? session.user : null;
    var changed = (next && next.id) !== (user && user.id);
    user = next;
    if (user && syncMeta.uid !== user.id) { syncMeta = { uid: user.id, synced: [] }; saveMeta(); }
    renderAccount();
    if (user && changed) {
      accountMsg("");
      setTimeout(function () { runSync(); }, 0);
    }
  }

  function googleLogin() {
    var btn = byId("googleBtn");
    btn.disabled = true;
    accountMsg(t("goingGoogle"));
    sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    }).then(function (res) {
      if (res && res.error) { btn.disabled = false; accountMsg(friendlyError(res.error)); }
    }, function (err) {
      btn.disabled = false;
      accountMsg(friendlyError(err));
    });
  }

  function finishLogout(wipe) {
    sb.auth.signOut().then(function () {}, function () {}).then(function () {
      user = null;
      if (wipe) wipeLocal();
      renderAccount();
      accountMsg(wipe ? t("loggedOutWiped") : t("loggedOutKept"));
    });
  }

  function bindAccount() {
    byId("googleBtn").addEventListener("click", googleLogin);
    byId("syncBtn").addEventListener("click", function () {
      runSync().then(function (okSync) { if (okSync === true) accountMsg(""); });
    });
    byId("logoutBtn").addEventListener("click", function () {
      accountMsg(t("checking"));
      runSync().then(function (okSync) {
        byId("logoutAsk").hidden = false;
        if (okSync === true) {
          byId("logoutWipe").disabled = false;
          accountMsg("");
        } else {
          // 동기화가 안 됐으면 기록을 지우는 선택지는 막아요
          byId("logoutWipe").disabled = true;
          accountMsg(t("unsynced"));
        }
      });
    });
    byId("logoutCancel").addEventListener("click", function () { byId("logoutAsk").hidden = true; accountMsg(""); });
    byId("logoutKeep").addEventListener("click", function () { finishLogout(false); });
    byId("logoutWipe").addEventListener("click", function () { finishLogout(true); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden) syncSoon(); });
    window.addEventListener("online", function () { syncSoon(); });
  }

  function startAuth() {
    try {
      sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
    } catch (e) { sb = null; return; }
    bindAccount();
    renderAccount();
    sb.auth.onAuthStateChange(function (event, session) {
      setTimeout(function () { applySession(session); }, 0);
    });
    sb.auth.getSession().then(function (res) {
      applySession(res && res.data ? res.data.session : null);
    }, function () {});
  }

  function loadSupabaseLib() {
    if (!CONFIG.loginEnabled || !CONFIG.supabaseUrl || !CONFIG.supabaseKey) return;
    if (window.supabase && window.supabase.createClient) { startAuth(); return; }
    var s = document.createElement("script");
    s.src = SB_LIB_URL;
    s.async = true;
    s.onload = function () { if (window.supabase && window.supabase.createClient) startAuth(); };
    s.onerror = function () {};
    document.head.appendChild(s);
  }

  // ---- 전체 다시 그리기 / 날짜가 바뀌면 화면도 새로 ----

  // 하루에 하나, 날짜가 같으면 몇 번을 열어도 같은 명언이에요.
  function renderQuote() {
    var d = new Date();
    var days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    var list = LANG === "ko" ? QUOTES_KO : QUOTES_EN;
    var q = list[((days % list.length) + list.length) % list.length];
    quoteTextEl.textContent = q.t;
    quoteByEl.textContent = "— " + q.a;
  }

  // 오전 8시~오후 6시 전에는 오늘이, 오후 6시부터는 내일이 비어 있을 때만 한 줄로 알려줘요.
  // 이미 그 탭을 보고 있거나(빈 화면 문구가 이미 있어요) 다이어리를 보는 중에는 숨겨요.
  function renderNudge() {
    var h = new Date().getHours();
    var targetKey = null;
    var msg = "";
    if (h >= 18) {
      targetKey = "tomorrow";
      msg = t("nudgeTomorrow");
    } else if (h >= 8) {
      targetKey = "daily";
      msg = t("nudgeToday");
    }

    var show = false;
    if (targetKey && !inDiary && activeKey !== targetKey) {
      var cat = CATEGORIES.filter(function (c) { return c.key === targetKey; })[0];
      show = listFor(cat).length === 0;
    }

    nudgeEl.hidden = !show;
    if (show) {
      nudgeEl.textContent = msg + "  ›";
      nudgeEl.setAttribute("data-target", targetKey);
    }
  }

  nudgeEl.addEventListener("click", function () {
    var key = nudgeEl.getAttribute("data-target");
    if (!key) return;
    activeKey = key;
    renderAll();
    inputEl.focus({ preventScroll: true });
  });

  function applyStatic() {
    document.documentElement.lang = LANG;
    document.title = t("docTitle");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-title]"), function (el) {
      el.setAttribute("title", t(el.getAttribute("data-i18n-title")));
    });
    var wk = document.getElementById("calWeek");
    var names = LANG === "ko" ? WEEKDAYS : ["S", "M", "T", "W", "T", "F", "S"];
    wk.innerHTML = "";
    names.forEach(function (n) { var sp = document.createElement("span"); sp.textContent = n; wk.appendChild(sp); });
    langBtn.textContent = t("langBtn");
    langBtn.setAttribute("aria-label", t("langBtnLabel"));
    diaryBtn.setAttribute("aria-label", inDiary ? t("diaryClose") : t("diaryOpen"));
    if (!sb) document.getElementById("storageNote").textContent = t("storageLocal");
  }

  function setLang(l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* 무시 */ }
    applyStatic();
    if (sb) renderAccount();
    renderAll();
  }

  function renderAll() {
    todayLabelEl.textContent = longDateYear(new Date());
    renderTabs();
    renderPanel();
    if (inDiary) renderDiary();
    renderQuote();
    renderNudge();
  }

  var lastDay = ymd(new Date());
  function checkDayChange() {
    var now = ymd(new Date());
    if (now !== lastDay) {
      lastDay = now;
      renderAll();
    }
  }
  setInterval(function () { checkDayChange(); renderNudge(); }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { checkDayChange(); renderNudge(); }
  });

  // ---- 반짝임 / 적기 ----

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function spawnSparkle(x, y) {
    if (reduceMotion) return;
    var el = document.createElement("div");
    el.className = "pop-sparkle";
    el.style.left = x + "px";
    el.style.top = y + "px";
    var words = t("sparkle");
    el.textContent = words[Math.floor(Math.random() * words.length)];
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 950);
  }

  formEl.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = inputEl.value.trim();
    if (!text) return;
    var cat = currentCat();
    var entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      text: text,
      done: false,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      date: dateForCat(cat),
      tokens: tokenize(text)
    };
    state[cat.store].push(entry);
    saveState();
    pushOne(entry, cat.store);
    inputEl.value = "";
    renderAll();
  });

  // ---- 별 ----
  (function initStars() {
    var wrap = document.getElementById("stars");
    var n = window.innerWidth < 480 ? 46 : 70;
    var html = "";
    for (var i = 0; i < n; i++) {
      var top = Math.random() * 100;
      var left = Math.random() * 100;
      var size = (Math.random() * 1.8 + 1).toFixed(1);
      var opMax = (Math.random() * 0.5 + 0.45).toFixed(2);
      var opMin = (opMax * 0.15).toFixed(2);
      var dur = (Math.random() * 3 + 2.2).toFixed(1);
      var delay = (Math.random() * 4).toFixed(1);
      html += '<span style="top:' + top + '%;left:' + left + '%;width:' + size + 'px;height:' + size + 'px;' +
        '--op-min:' + opMin + ';--op-max:' + opMax + ';' +
        'animation-duration:' + dur + 's;animation-delay:-' + delay + 's;"></span>';
    }
    wrap.innerHTML = html;
  })();

  langBtn.addEventListener("click", function () { setLang(LANG === "ko" ? "en" : "ko"); });
  applyStatic();
  renderAll();
  loadSupabaseLib();
})();
</script>

</body>
</html>
